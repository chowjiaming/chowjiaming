<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">toolcall-timeline</title>
  <desc id="desc">Network-tab style waterfall for MCP tool calls</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="barOk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="barWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="barAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3792f"/>
      <stop offset="100%" stop-color="#f0a35e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="318" rx="15" fill="none" stroke="#30363d"/>

  <!-- chrome -->
  <circle cx="28" cy="28" r="5" fill="#f85149"/>
  <circle cx="46" cy="28" r="5" fill="#d29922"/>
  <circle cx="64" cy="28" r="5" fill="#3fb950"/>
  <rect x="90" y="18" width="220" height="20" rx="6" fill="#21262d"/>
  <text x="102" y="32" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">localhost:7333 � session</text>

  <!-- title -->
  <text x="28" y="72" fill="#e6edf3" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600">toolcall-timeline</text>
  <text x="28" y="96" fill="#8b949e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">MCP tool-call waterfall � local-first</text>

  <!-- column headers -->
  <text x="28" y="130" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Name</text>
  <text x="280" y="130" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Waterfall</text>
  <text x="560" y="130" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ms</text>
  <line x1="28" y1="140" x2="612" y2="140" stroke="#21262d"/>

  <!-- rows -->
  <text x="28" y="168" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">initialize</text>
  <rect x="280" y="156" width="72" height="14" rx="3" fill="url(#barOk)"/>
  <text x="560" y="168" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">42</text>

  <text x="28" y="200" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tools/list</text>
  <rect x="300" y="188" width="110" height="14" rx="3" fill="url(#barOk)"/>
  <text x="560" y="200" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">118</text>

  <text x="28" y="232" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tools/call � fs.read</text>
  <rect x="340" y="220" width="168" height="14" rx="3" fill="url(#barAccent)"/>
  <text x="560" y="232" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">286</text>

  <text x="28" y="264" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tools/call � search</text>
  <rect x="360" y="252" width="130" height="14" rx="3" fill="url(#barWarn)"/>
  <text x="560" y="264" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">204</text>

  <!-- footer chips -->
  <rect x="28" y="286" width="58" height="20" rx="10" fill="#21262d"/>
  <text x="40" y="300" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">stdio</text>
  <rect x="94" y="286" width="48" height="20" rx="10" fill="#21262d"/>
  <text x="106" y="300" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">MCP</text>
  <rect x="150" y="286" width="72" height="20" rx="10" fill="#21262d"/>
  <text x="162" y="300" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">local-only</text>
</svg>
